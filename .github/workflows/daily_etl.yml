name: Ejecución Diaria del Pipeline ETL

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 AM UTC (1:00 AM hora de Colombia)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutar el proceso manualmente desde GitHub cuando quieras

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline ETL
        run: python etl_pipeline.py
